# 前端单页部署：把 main/web/index.html 发布到 GitHub Pages，供前后端分离使用。
# 部署后打开 <user>.github.io/<repo>/，登录框填设备的 ws(s) 地址即可远程控制
# （HTTPS 页面需填 wss://，参见 README「前后端分离」）。
#
# 前提：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
name: Deploy static content to Pages

on:
  # 仅当 main/web 目录（前端）变化时触发；固件改动不触发部署
  push:
    branches: ["main"]
    paths: ["main/web/**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify front-end file exists
        run: test -f ./main/web/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 仅上传 main 分支下 web 目录的静态资源（前后端分离：只部署前端页面）
          path: './main/web'
          # 目录为空或缺少文件时让部署直接失败，避免发布一个空站点
          if-no-files: error
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
