# 固件构建 CI：push / PR 时用 Espressif 官方 ESP-IDF Docker 镜像编译固件，
# 确保代码能通过编译。target = esp32c3，IDF 版本与 README 一致（v6.0.2）。
name: Build firmware

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c3
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: |
            build/*.bin
            build/*.elf
            build/flasher_args.json
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 14
